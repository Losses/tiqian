# ADR 0050: neutral Rust binding of the layout engine. Language and ecosystem
# surfaces live under frontend/ (same reasoning as ADR 0045 adding K/N targets
# inside the engine modules instead of new root dirs); web-domain crates live in
# platforms/web/server/precompute.
[workspace]
resolver = "2"
members = ["tiqian"]
# engine-gen 是 tiqian 的 path 依赖（vendored 生成树）。放在工作区目录下会被 Cargo
# 自动纳入成员，于是 cargo test 会连带跑生成的引擎测试套件——那不是本工作区的验收面
# （生成的引擎 Rust 测试属 boring 侧 Rust 目标的独立工作）。排除它，仍可作 path 依赖使用；
# 需要跑引擎测试时显式指定其 manifest 路径。
exclude = ["engine-gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
