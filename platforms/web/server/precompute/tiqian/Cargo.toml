# ADR 0050: direct Rust consumption of the generated layout engine. The
# generated crate comes from the boring engine-rust-f64 bundle; run
# `nix develop -c node .haxelib/boring/git/out/bundle/driver.js gen engine-rust-f64 --project boring.json`
# (or copy the checked-out bundle output) before building this crate.
[package]
name = "tiqian"
description = "Direct Rust consumption of the generated Tiqian CJK paragraph layout engine"
version.workspace = true
edition.workspace = true

[dependencies]
tiqian-engine-gen = { path = "../engine-gen" }
