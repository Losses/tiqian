[package]
name = "tiqian-precompute"
description = "Font session and precompute orchestration for Tiqian in Rust"
version.workspace = true
edition.workspace = true

[dependencies]
tiqian = { path = "../../../../../ffi/rust/tiqian", version = "0.1.0" }
# The generated engine crate the ffi facade consumes; path mirrors the
# tiqian crate's own dependency so both compile the same checkout.
tiqian-engine-gen = { path = "../../../../../engine-haxe/out/engine-rust-f64/gen" }
tiqian-protocol-gen = { path = "../protocol-gen" }
harfrust = "0.13"
skrifa = "0.46"
read-fonts = "0.43"
wuff = { version = "0.2", default-features = false, features = ["brotli"] }
sha2 = "0.10"
html5ever = "0.39.0"
url = "2"