name: Release

# One version tag publishes every package. The gate job refuses the release
# when any required lane is red on the tagged commit; the publishing jobs run
# in dependency order and the registry write, which produces the publicly
# visible version, runs only after every other lane succeeded.
#
# Re-running a failed release: use "Re-run failed jobs" on this run. Every
# lane runs from the same tag commit, and npm refuses to overwrite a version
# that already landed, so a re-run cannot publish a different artifact.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit

  npm-ffi:
    needs: [gate]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-ffi.yml
    secrets: inherit

  npm-core:
    needs: [gate, npm-ffi]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-core.yml
    secrets: inherit

  npm-prose:
    needs: [gate, npm-core]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-prose.yml
    secrets: inherit

  npm-precompute:
    needs: [gate, npm-prose]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-precompute.yml
    secrets: inherit

  maven:
    needs: [gate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      version: ${{ needs.gate.outputs.version }}

  registry:
    needs: [gate, npm-precompute, npm-ffi, npm-core, npm-prose, maven]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-registry.yml
    secrets: inherit