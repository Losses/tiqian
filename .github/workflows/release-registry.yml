name: Release to Registry

# The registry write is the last job of .github/workflows/release.yml: a
# version is only written here after every npm and Maven lane succeeded. The
# workflow can also be dispatched on a release tag to finish the registry
# write after a failed run, and the gate refuses a red commit either way.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-registry-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_ENDPOINT: https://91a3e85bc149574f96f64f55aa2c900e.r2.cloudflarestorage.com
  R2_BUCKET: tiqian-registry
  REGISTRY_REPO: tiqian-cjk/registry

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  pack-and-publish:
    needs: [release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tiqian
        uses: actions/checkout@v4

      - name: Validate the release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "::error::The registry lane runs only from a v*.*.* release tag, received ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install the TypeScript compiler
        # The ts and protocol-ts bundles compile their package shell with tsc.
        run: bun add -g "typescript@^5.9.0"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Stage the pinned generation inputs
        # tools/unicode-data/ lives outside git and is read at compile time by
        # reflaxe.unicode.GraphemeData. The files come from the pinned boring
        # checkout. The golden staging was removed with the golden mechanism
        # in the Kotlin cutover; only the Unicode data is staged here.
        run: |
          nix develop -c bash -c 'mkdir -p tools/unicode-data && cp -a .haxelib/boring/git/tools/unicode-data/. tools/unicode-data/'
          ls -l tools/unicode-data

      - name: Align the package versions with the release
        # The registry names every artifact <package>-<version> from the tag,
        # so the packed manifests have to carry that version, not the 0.1.0
        # placeholder in the project file.
        run: python3 tools/align-package-versions.py "${GITHUB_REF_NAME#v}"

      - name: Build packages via boring
        # The bundle list comes from boring.json through tools/release-matrix.py;
        # engine-rust-f32 is excluded there with a reason.
        # The same pack run also writes the registry tree. The four
        # --registry-* arguments carry the publish target: --owner is the
        # repository owner, --repo the repository name, --asset-base the
        # GitHub Release download prefix of this tag, and --registry-out the
        # tree root. All four together enable the write; passing none keeps
        # the artifact-only behavior.
        run: |
          nix develop -c bash -c 'boring pack $(python3 tools/release-matrix.py --list-bundles) --registry-out "$RUNNER_TEMP/registry-tree" --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}" --asset-base "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"'

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          # Every artifact is copied under the name the target wrote, and that
          # name is what the registry metadata and the download redirects use:
          # the cargo crate is tiqian-engine-<version>.crate, the Maven files
          # and the Swift archive carry the precision stem.
          find engine-haxe/out \( -name "*.tgz" -o -name "*.tar.gz" -o -name "*.jar" -o -name "*.crate" -o -name "*.zip" -o -name "*.pom" \) | while read -r f; do
            cp "$f" "release-artifacts/$(basename "$f")"
          done
          test -n "$(ls -A release-artifacts)" || { echo "no pack artifacts were produced"; exit 1; }
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the Swift archives to the registry storage
        # The Swift index points at <archive-base>/swift/<scope>/<name>/<version>.zip,
        # so the archive has to exist there before the metadata references it.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -m pip install --quiet awscli
          # Archives are named <package>-<version>.zip, so the package name is the
          # file name without its version suffix. Matching a "swift-" prefix
          # silently skipped the upload once the names changed, leaving a stale
          # archive in the bucket whose digest no longer matched the metadata.
          for zip in release-artifacts/*.zip; do
            [ -f "$zip" ] || continue
            name=$(basename "$zip" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*\.zip$//')
            aws s3 cp "$zip" "s3://${{ env.R2_BUCKET }}/swift/tiqian/$name/$VERSION.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done

      - name: Commit metadata to registry repo
        run: |
          git clone https://x-access-token:${{ secrets.REGISTRY_REPO_TOKEN }}@github.com/${{ env.REGISTRY_REPO }}.git /tmp/registry
          VERSION=${GITHUB_REF_NAME#v}
          OWNER="${{ github.repository_owner }}"
          rm -rf "/tmp/registry/$OWNER"
          cp -a "$RUNNER_TEMP/registry-tree/$OWNER" "/tmp/registry/$OWNER"
          cd /tmp/registry
          git config user.name "Release Bot"
          git config user.email "release@tiqian.dev"
          git add .
          # A re-run for the same tag finds the metadata already committed;
          # an empty commit would exit non-zero and fail the job.
          if git diff --cached --quiet; then
            echo "registry metadata for $VERSION is already current"
          else
            git commit -m "release: ${{ github.repository }} ${{ github.ref_name }}"
            git push origin main
          fi
      - name: Deploy the registry site
        # The Pages Git integration does not fire for every push to the
        # registry repository (only one deployment appeared for several
        # commits), so the deploy hook triggers the production build.
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$PAGES_DEPLOY_HOOK" ]; then
            echo "PAGES_DEPLOY_HOOK is not configured; skipping the deployment"
            exit 0
          fi
          curl -fsS -X POST "$PAGES_DEPLOY_HOOK" | head -c 200
