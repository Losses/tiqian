name: Publish precompute packages

# Release workflow for @tiqian/precompute and its four platform packages
# (ADR 0050). The addons build the generated Rust engine directly through
# platforms/web/server/precompute/binding, which consumes the boring
# engine-rust bundle; the legacy Kotlin/Native C ABI engine archive is
# retired with the Stage1 cutover.
on:
  push:
    tags:
      - "@tiqian/precompute@*"

permissions:
  contents: read

concurrency:
  group: publish-tiqian-precompute
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release tag and package set
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./platforms/web/server/core/package.json').version")"
          expected_tag="@tiqian/precompute@${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag target ${tag_commit} does not match workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            platform_name="$(node -p "require('./platforms/web/server/core/platforms/${platform}/package.json').name")"
            platform_version="$(node -p "require('./platforms/web/server/core/platforms/${platform}/package.json').version")"
            if [[ "${platform_name}" != "@tiqian/precompute-${platform}" || "${platform_version}" != "${version}" ]]; then
              echo "::error::Platform package ${platform} is ${platform_name}@${platform_version}, expected @tiqian/precompute-${platform}@${version}"
              exit 1
            fi
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  binaries:
    name: Build addon (${{ matrix.platform }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - platform: darwin-arm64
            os: macos-latest
          - platform: win32-x64-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install workspace dependencies
        working-directory: .
        # npm install, not npm ci: the platform binary optional deps of the
        # precompute member are not on the registry, so no lockfile can carry
        # resolved entries for them and npm ci (npm >= 11) rejects the gap.
        run: npm install --no-audit --no-fund

      - name: Build addon and place platform binary
        working-directory: platforms/web/server/core
        shell: bash
        env:
          NEON_BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          cargo build --manifest-path ../precompute/binding/Cargo.toml \
            --release --message-format=json-render-diagnostics > cargo.log
          npx neon dist --name tiqian-precompute-neon < cargo.log
          test -f "platforms/${NEON_BUILD_PLATFORM}/index.node"

      - name: Smoke test through the npm loader
        working-directory: platforms/web/server/core
        shell: bash
        run: npm test

      - name: Pack platform package
        working-directory: platforms/web/server/core/platforms/${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p ../../pack-output
          PACK_OUTPUT=$(npm pack --pack-destination ../../pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the platform package."
            exit 1
          fi
          FILENAME=$(basename "$PACK_OUTPUT")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
        id: pack

      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-package-${{ matrix.platform }}
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  main-package:
    name: Pack main package
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install workspace dependencies
        working-directory: .
        # npm install, not npm ci: the platform binary optional deps of the
        # precompute member are not on the registry, so no lockfile can carry
        # resolved entries for them and npm ci (npm >= 11) rejects the gap.
        run: npm install --no-audit --no-fund

      - name: Lint, typecheck, and build the JS entry
        working-directory: platforms/web/server/core
        run: |
          npm run lint
          npm run build
          npm run typecheck

      - name: Pack
        working-directory: platforms/web/server/core
        shell: bash
        id: pack
        run: |
          mkdir -p pack-output
          PACK_OUTPUT=$(npm pack --pack-destination pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the main package."
            exit 1
          fi
          echo "filename=$(basename "$PACK_OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Upload main package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-package
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified tarballs to alpha
    needs: [validate, binaries, main-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages

      - name: Verify a complete package set
        shell: bash
        run: |
          set -euo pipefail
          expected="binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc main-package"
          for name in $expected; do
            if ! find "packages/$name" -name '*.tgz' | grep -q .; then
              echo "::error::Artifact $name contains no package."
              exit 1
            fi
          done
          while IFS= read -r -d '' tarball; do
            if [[ "$(basename "$tarball")" != *"-${RELEASE_VERSION}.tgz" ]]; then
              echo "::error::$(basename "$tarball") does not carry version ${RELEASE_VERSION}."
              exit 1
            fi
          done < <(find packages -name '*.tgz' -print0)

      # Platform packages first: the main package lists them as optional
      # dependencies at the same version.
      - name: Publish each tarball
        shell: bash
        run: |
          set -euo pipefail
          for name in binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc; do
            tarball="$(find "packages/$name" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            npm publish "${tarball}" --ignore-scripts --access public --tag alpha
          done
          tarball="$(find packages/main-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          npm publish "${tarball}" --ignore-scripts --access public --tag alpha

  sync-latest:
    name: Synchronize latest dist-tags
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the release npm CLI
        run: npm install --global npm@11.12.1

      - name: Point latest at the published alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_DIST_TAG_TOKEN is not configured"
            exit 1
          fi
          for package in \
            @tiqian/precompute \
            @tiqian/precompute-darwin-arm64 \
            @tiqian/precompute-linux-arm64-gnu \
            @tiqian/precompute-linux-x64-gnu \
            @tiqian/precompute-win32-x64-msvc; do
            npm dist-tag add "${package}@${RELEASE_VERSION}" latest
          done

      - name: Verify alpha and latest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            converged=1
            for package in \
              @tiqian/precompute \
              @tiqian/precompute-darwin-arm64 \
              @tiqian/precompute-linux-arm64-gnu \
              @tiqian/precompute-linux-x64-gnu \
              @tiqian/precompute-win32-x64-msvc; do
              tags="$(npm view "${package}" dist-tags --json)"
              if ! DIST_TAGS="${tags}" node -e '
                const tags = JSON.parse(process.env.DIST_TAGS);
                const version = process.env.RELEASE_VERSION;
                if (tags.alpha !== version || tags.latest !== version) process.exit(1);
              '; then
                converged=0
              fi
            done
            if [[ "${converged}" -eq 1 ]]; then
              echo "alpha and latest both point to ${RELEASE_VERSION} for all five packages"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::npm dist-tags did not converge on ${RELEASE_VERSION}"
          exit 1
