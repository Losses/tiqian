name: Publish core package

# Release lane for @tiqian/core. The package is the dependency of
# @tiqian/prose, so it has to be on the registry before the prose lane
# publishes; the release entrypoint orders the two lanes that way.
#
# Every npm lane is callable only from the release entrypoint (or dispatched
# on a v*.*.* tag), and each one runs the release gate before publishing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-tiqian-core
  cancel-in-progress: false

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  publish-alpha:
    name: Verify and publish alpha
    needs: [release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1

      - name: Validate the release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "::error::This lane runs only from a v*.*.* release tag, received ${GITHUB_REF_NAME}."
            exit 1
          fi
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag target ${tag_commit} does not match workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          version="$(node -p "require('./platforms/web/client/core/package.json').version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install workspace dependencies
        working-directory: .
        # npm install, not npm ci: the platform binary optional deps of the
        # precompute member are not on the registry, so no lockfile can carry
        # resolved entries for them and npm ci (npm >= 11) rejects the gap.
        run: npm install --no-audit --no-fund

      - name: Verify the package contents
        working-directory: platforms/web/client/core
        run: npm run verify:package

      - name: Build and pack the release tarball
        working-directory: platforms/web/client/core
        env:
          TIQIAN_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/tiqian-core-release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TIQIAN_RELEASE_ARTIFACT_DIR}"
          npm run build
          npm pack --pack-destination "${TIQIAN_RELEASE_ARTIFACT_DIR}"
          test "$(find "${TIQIAN_RELEASE_ARTIFACT_DIR}" -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1

      - name: Publish the verified tarball to alpha
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find "${RUNNER_TEMP}/tiqian-core-release" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "${tarball}" ]]; then
            echo "::error::Verified release tarball is missing"
            exit 1
          fi
          npm publish "${tarball}" --ignore-scripts --access public --tag alpha

  sync-latest:
    name: Synchronize latest dist-tag
    needs: publish-alpha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the release npm CLI
        run: npm install --global npm@11.12.1

      - name: Point latest at the published alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish-alpha.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_DIST_TAG_TOKEN is not configured"
            exit 1
          fi
          npm dist-tag add "@tiqian/core@${RELEASE_VERSION}" latest

      - name: Verify alpha and latest
        env:
          RELEASE_VERSION: ${{ needs.publish-alpha.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            tags="$(npm view @tiqian/core dist-tags --json)"
            if DIST_TAGS="${tags}" node --input-type=module -e '
              const tags = JSON.parse(process.env.DIST_TAGS);
              const version = process.env.RELEASE_VERSION;
              if (tags.alpha !== version || tags.latest !== version) process.exit(1);
            '; then
              echo "alpha and latest both point to ${RELEASE_VERSION}"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::npm dist-tags did not converge on ${RELEASE_VERSION}"
          exit 1
